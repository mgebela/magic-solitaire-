[build]
  base = "."
  command = "npm ci && npm run build --workspace=@three-towers/client"
  publish = "apps/client/dist"

# Never cache HTML shell — prevents stale chunk references after deploys
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Hashed assets are immutable
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Wallet nonce/verify (and a few JSON stubs) live in netlify/functions/api.ts.
# Set API_ORIGIN to proxy those same /api/* paths to a NestJS server instead.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Force /api/* to the function so the SPA rewrite below cannot return index.html.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA routing — static files in dist are served before this rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
